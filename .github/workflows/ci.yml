name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.lock
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-ci.lock
      - name: Verify dependency lock freshness
        run: python tools/check_requirements_lock.py
      - name: Run core contracts
        run: >-
          python -m pytest -q
          tests/test_core_foundation_tools.py
          tests/test_runtime_state.py
          tests/test_finding_index.py
          tests/test_action_queue.py
          tests/test_evidence_ledger.py
          tests/test_checkpoint.py
          tests/test_autopilot_round.py
      - name: Run repository Shell contracts
        run: |
          bash tests/test_cicd_scanner.sh
          bash tests/test_recon_denoising_integration.sh

  full-suite:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.lock
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-ci.lock
      - name: Run full test suite
        run: python -m pytest -q tests
      - name: Run strict knowledge audit
        run: python tools/knowledge_audit.py --strict
